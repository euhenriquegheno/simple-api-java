name: Continuous Integration
on:
    pull_request:
        branches:
            - develop
jobs:
    tests:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5.0.0

            - name: Setup Java SDK
              uses: actions/setup-java@v5.0.0
              with: 
                  distribution: 'temurin'  
                  java-version: '21' 

            - name: Unit tests
              run: mvn test